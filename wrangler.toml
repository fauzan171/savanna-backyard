# For more details on how to configure Wrangler, refer to:
# https://developers.cloudflare.com/workers/wrangler/configuration/

name = "savanna-backyard"
main = "./src/worker/index.ts"
compatibility_date = "2025-10-08"
compatibility_flags = ["nodejs_compat"]
upload_source_maps = true

[observability]
enabled = true

# Assets configuration for SPA
[assets]
directory = "./dist/client"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

# D1 Database
[[d1_databases]]
binding = "DB"
database_name = "savanna-backyard-db"
database_id = "11de4510-a98c-4d40-9e4c-6f4cfe5fa1f2"

# Environment Variables
[vars]
ENVIRONMENT = "production"
ALLOWED_PUBLIC_API_ORIGINS = "https://landingpage-cud.pages.dev,https://savanna-landdigpage.andifauzan986.workers.dev"
CORS_ALLOWED_ORIGINS = "https://landingpage-cud.pages.dev,https://savanna-landdigpage.andifauzan986.workers.dev"
IFORTEPAY_MERCHANT_ID = ""
IFORTEPAY_SECRET_UNBOUND_ID = ""
IFORTEPAY_HASH_KEY = ""
IFORTEPAY_CALLBACK_URL = ""
IFORTEPAY_SUCCESS_REDIRECT_URL = ""
IFORTEPAY_FAILED_REDIRECT_URL = ""

# R2 Storage for file uploads
[[r2_buckets]]
binding = "UPLOADS"
bucket_name = "savanna-uploads"

# Secrets (set via wrangler secret put)
# JWT_SECRET
