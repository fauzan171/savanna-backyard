# ============================================================
# Savanna Bromo Rental - Public API Contract
# For: Landing Page Frontend Team
# Base URL: https://api.savannabromo.com/api/v1/public
# Auth: X-API-Key header (provided by backend team)
# Date: 2026-06-20
# ============================================================

openapi: 3.0.3
info:
  title: Savanna Bromo Rental - Public API
  description: |
    Public API untuk landing page Savanna Bromo Rental.
    Semua request WAJIB menyertakan header `X-API-Key`.

    ## Response Format
    Semua response mengikuti format:
    ```json
    {
      "success": true,
      "data": { ... },
      "message": "optional message"
    }
    ```

    Error format:
    ```json
    {
      "success": false,
      "error": {
        "code": "ERROR_CODE",
        "message": "Human readable message"
      }
    }
    ```

    ## Date Format
    Tanggal menerima dua format:
    - `YYYY-MM-DD` (date only, e.g. `2026-07-01`)
    - ISO 8601 datetime dengan timezone (e.g. `2026-07-01T02:00:00+07:00`)
    
    Backend secara otomatis mengekstrak bagian tanggal (`YYYY-MM-DD`) dari input datetime.
    Response endpoint booking (`POST /bookings`, `GET /bookings/{n}/status`) selalu mengembalikan
    format ISO 8601 datetime penuh agar FE bisa langsung menampilkan jam pickup & deadline return.

    ## Currency
    Semua harga dalam IDR (Rupiah Indonesia), bertipe number.
  version: 1.0.0
  contact:
    name: Backend Team

servers:
  - url: https://api.savannabromo.com/api/v1/public
    description: Production
  - url: http://localhost:8484/api/v1/public
    description: Local Development

# ============================================================
# SECURITY
# ============================================================
security:
  - ApiKeyAuth: []

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: API key yang didapat dari backend team
    CookieAuth:
      type: apiKey
      in: cookie
      name: token
      description: httpOnly JWT cookie (type 'public') set by /auth/phone/verify (the login). Required (in addition to X-API-Key) for account endpoints (/auth/me, /auth/profile, /me/*). Cross-origin: send with `credentials: 'include'`.

  schemas:
    # ---- Common Error ----
    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: object
          properties:
            code:
              type: string
              example: VALIDATION_ERROR
            message:
              type: string
              example: "startDate is required"

    # ---- Vehicle Types ----
    VehicleType:
      type: object
      properties:
        type:
          type: string
          enum: [TrailBike, StreetBike, Car, Jeep, Other]
          example: TrailBike
        displayName:
          type: string
          example: "Trail Bike"
        count:
          type: integer
          example: 4
        minDailyRate:
          type: number
          example: 150000
        maxDailyRate:
          type: number
          example: 350000

    # ---- Vehicle ----
    VehicleListItem:
      type: object
      properties:
        id:
          type: string
          example: "v_abc123"
        name:
          type: string
          example: "Honda CRF 250L"
        type:
          type: string
          enum: [TrailBike, StreetBike, Car, Jeep, Other]
          example: TrailBike
        category:
          type: string
          nullable: true
          example: "Adventure"
        image:
          type: string
          nullable: true
          example: "https://api.savannabromo.com/api/v1/uploads/vehicles/crf250.jpg"
        dailyRateIdr:
          type: number
          example: 250000
        specs:
          type: object
          nullable: true
          additionalProperties:
            type: string
          example:
            engine: "250cc"
            transmission: "6-speed"
        description:
          type: string
          nullable: true
          example: "Perfect for Bromo trail riding"
        available:
          type: boolean
          example: true

    VehicleDetail:
      type: object
      properties:
        id:
          type: string
          example: "v_abc123"
        name:
          type: string
          example: "Honda CRF 250L"
        type:
          type: string
          enum: [TrailBike, StreetBike, Car, Jeep, Other]
          example: TrailBike
        brand:
          type: string
          nullable: true
          example: "Honda"
        model:
          type: string
          nullable: true
          example: "CRF 250L"
        year:
          type: integer
          nullable: true
          example: 2024
        category:
          type: string
          nullable: true
          example: "150cc Trail"
        dailyRateIdr:
          type: number
          example: 250000
        image:
          type: string
          nullable: true
          example: "https://api.savannabromo.com/api/v1/uploads/vehicles/crf250.jpg"
        specs:
          type: object
          nullable: true
          additionalProperties:
            type: string
          example:
            engine: "150cc"
            power: "12.7 HP"
            weight: "122 kg"
        description:
          type: string
          nullable: true
          example: "Perfect for Bromo trail riding"
        available:
          type: boolean
          example: true

    # ---- Availability ----
    AvailableVehicle:
      type: object
      properties:
        id:
          type: string
          example: "v_abc123"
        name:
          type: string
          example: "Honda CRF 250L"
        type:
          type: string
          example: TrailBike
        dailyRateIdr:
          type: number
          example: 250000
        photoUrl:
          type: string
          nullable: true

    UnavailableVehicle:
      type: object
      properties:
        id:
          type: string
          example: "v_xyz789"
        name:
          type: string
          example: "Kawasaki KLX 230"
        reason:
          type: string
          enum: ["Already booked", "Under maintenance", "Currently unavailable"]
          example: "Already booked"

    # ---- Packages ----
    Package:
      type: object
      properties:
        id:
          type: string
          example: "pkg_001"
        name:
          type: string
          example: "Bromo Sunrise Tour"
        tagline:
          type: string
          nullable: true
          example: "Experience the magic of Bromo sunrise"
        description:
          type: string
          nullable: true
          example: "Full day tour to Mount Bromo..."
        image:
          type: string
          nullable: true
          example: "https://api.savannabromo.com/api/v1/uploads/packages/sunrise.jpg"
        duration:
          type: string
          nullable: true
          example: "1 day"
        distance:
          type: string
          nullable: true
          example: "30 km"
        groupSize:
          type: string
          nullable: true
          example: "2-6 people"
        price:
          type: number
          example: 500000
        trailId:
          type: string
          nullable: true
          example: "trail_001"

    # ---- Pricing ----
    PricingTier:
      type: object
      properties:
        id:
          type: string
          example: "tier_001"
        name:
          type: string
          example: "Standard"
        description:
          type: string
          nullable: true
          example: "Basic trail bike rental"
        dailyPrice:
          type: number
          example: 200000
        multiDayPrice:
          type: number
          example: 175000
        features:
          type: array
          items:
            type: string
          example:
            - "Trail bike rental"
            - "Helmet included"
            - "Basic insurance"
        notIncluded:
          type: array
          items:
            type: string
          example:
            - "Meals"
            - "Accommodation"
        highlighted:
          type: boolean
          example: false
        icon:
          type: string
          nullable: true
          example: "motorcycle"

    # ---- Reviews ----
    Review:
      type: object
      properties:
        id:
          type: string
          example: "rev_001"
        name:
          type: string
          example: "John Doe"
        location:
          type: string
          nullable: true
          example: "Jakarta, Indonesia"
        rating:
          type: integer
          minimum: 1
          maximum: 5
          example: 5
        text:
          type: string
          example: "Amazing experience! The trail was incredible."
        avatar:
          type: string
          nullable: true
          description: "2-letter initials from customer name (e.g. 'JD' for 'John Doe')"
          example: "JD"
        createdAt:
          type: string
          format: date-time
          example: "2026-05-15T10:30:00.000Z"

    # ---- Trails ----
    Trail:
      type: object
      properties:
        id:
          type: string
          example: "trail_001"
        name:
          type: string
          example: "Bromo Crater Trail"
        desc:
          type: string
          nullable: true
          example: "Classic route to Bromo crater"
        terrain:
          type: string
          nullable: true
          example: "Volcanic sand, rocky"
        elevation:
          type: string
          nullable: true
          example: "2,329m"
        difficulty:
          type: string
          nullable: true
          example: "Moderate"
        recommended:
          type: string
          nullable: true
          example: "Best for intermediate riders"
        image:
          type: string
          nullable: true
        mapImage:
          type: string
          nullable: true

    TrailDetail:
      allOf:
        - $ref: "#/components/schemas/Trail"
        - type: object
          properties:
            blogContent:
              type: object
              nullable: true
              properties:
                overview:
                  type: string
                  nullable: true
                  description: "Markdown content for the trail overview section"
                subtitle:
                  type: string
                  nullable: true
                  description: "Short subtitle shown below the title"
                tips:
                  type: string
                  nullable: true
                  description: "Markdown content for riding tips"
                gallery:
                  type: array
                  items:
                    type: string
                  example:
                    - "https://api.savannabromo.com/api/v1/uploads/trails/gal1.jpg"
                    - "https://api.savannabromo.com/api/v1/uploads/trails/gal2.jpg"
                gpxUrl:
                  type: string
                  nullable: true
                  example: "https://api.savannabromo.com/api/v1/uploads/trails/sea_of_sand.gpx"
                estimatedDuration:
                  type: string
                  nullable: true
                  example: "3-4 hours"
                distance:
                  type: string
                  nullable: true
                  example: "12 km"
                bestTime:
                  type: string
                  nullable: true
                  example: "April - October"
                stages:
                  type: array
                  nullable: true
                  description: "Itinerary stages for the trail"
                  items:
                    type: object
                    properties:
                      name:
                        type: string
                        example: "Start Point - Cemoro Lawang"
                      desc:
                        type: string
                        example: "Begin at the viewpoint parking area"
                  example:
                    - name: "Cemoro Lawang Viewpoint"
                      desc: "Start at the famous viewpoint overlooking the caldera"
                    - name: "Sea of Sand Descent"
                      desc: "Descend into the vast volcanic sand plain"
                    - name: "Mount Bromo Crater"
                      desc: "Hike up to the crater rim (200 steps)"
                checklist:
                  type: array
                  nullable: true
                  description: "Gear/equipment checklist for riders"
                  items:
                    type: string
                  example:
                    - "Riding boots (ankle protection)"
                    - "Gloves"
                    - "Goggles or sunglasses"
                    - "Sunscreen SPF 50+"
                    - "Warm layer (morning temperatures can drop to 5°C)"
                culture:
                  type: string
                  nullable: true
                  description: "Cultural rules and etiquette to be aware of"
                  example: "Respect the Tenggerese Hindu tradition. Do not disturb prayer offerings near the crater. Ask permission before photographing locals."
                warning:
                  type: string
                  nullable: true
                  description: "Safety warnings and hazards"
                  example: "Volcanic gases can be strong near the crater — bring a mask. Sand riding requires intermediate+ skill level. Weather changes rapidly above 2000m."

    # ---- Settings ----
    Settings:
      type: object
      properties:
        contactEmail:
          type: string
          example: "info@savannabromo.com"
        contactPhone:
          type: string
          example: "+628123456789"
        whatsappNumber:
          type: string
          example: "628123456789"
        location:
          type: string
          example: "Bromo, East Java, Indonesia"
        instagramUrl:
          type: string
          example: "https://instagram.com/savannabromo"
        bankAccount:
          type: object
          properties:
            bankName:
              type: string
              example: "BCA"
            accountNumber:
              type: string
              example: "1234567890"
            accountHolder:
              type: string
              example: "PT Savanna Bromo"
        deposit:
          type: object
          properties:
