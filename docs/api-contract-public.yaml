  # ============================================================
  # 12. LEADS (Contact Form / Inquiry)
  # ============================================================
  /leads:
    post:
      tags: [Leads]
      summary: Submit inquiry / contact form
      description: |
        Mengirim inquiry atau pesan dari form kontak di landing page.
        Data akan masuk ke sistem CRM admin sebagai lead baru.

        **Source otomatis:** Jika tidak dikirim, source default ke "Website".
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - phone
              properties:
                name:
                  type: string
                  description: Nama lengkap
                  example: "Budi Santoso"
                  minLength: 2
                phone:
                  type: string
                  description: Nomor telepon (min 10 digit)
                  example: "+628123456789"
                  minLength: 10
                email:
                  type: string
                  format: email
                  description: Email (opsional)
                  example: "budi@email.com"
                  nullable: true
                message:
                  type: string
                  description: Pesan/inquiry (opsional, max 1000 char)
                  example: "Saya tertarik dengan paket Bromo Sunrise Tour"
                  maxLength: 1000
                  nullable: true
                source:
                  type: string
                  enum: [WhatsApp, Instagram, Facebook, TikTok, Website, WalkIn]
                  description: Sumber lead (default: Website)
                  example: "Website"
                preferredDates:
                  type: object
                  nullable: true
                  description: Tanggal yang diinginkan (opsional)
                  properties:
                    start:
                      type: string
                      pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$"
                      description: Tanggal mulai
                      example: "2026-07-01"
                    end:
                      type: string
                      pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$"
                      description: Tanggal selesai
                      example: "2026-07-03"
                    vehicleInterest:
                      type: string
                      enum: [TrailBike, StreetBike, Car, Jeep, Other]
                      description: Tipe kendaraan yang diminati
                    vehicleTypeId:
                      type: string
                      description: ID kendaraan spesifik yang diminati
            examples:
              simple:
                summary: Simple inquiry
                value:
                  name: "Budi Santoso"
                  phone: "+628123456789"
                  message: "Saya tertarik dengan paket Bromo Sunrise Tour"
              full:
                summary: Full inquiry with preferred dates
                value:
                  name: "Budi Santoso"
                  phone: "+628123456789"
                  email: "budi@email.com"
                  message: "Saya tertarik dengan paket Bromo Sunrise Tour"
                  source: "Instagram"
                  preferredDates:
                    start: "2026-07-01"
                    end: "2026-07-03"
                    vehicleInterest: "TrailBike"
                    vehicleTypeId: "v_001"
      responses:
        "201":
          description: Lead submitted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Lead submitted successfully"
                  data:
                    $ref: "#/components/schemas/LeadSubmitResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

