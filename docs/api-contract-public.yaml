  # ============================================================
  # VEHICLE AVAILABILITY CALENDAR
  # ============================================================
  /vehicles/{id}/availability:
    get:
      tags: [Availability]
      summary: Kalender ketersediaan kendaraan per bulan
      description: "Mengembalikan tanggal tersedia vs terpesan untuk sebulan. Sebuah booking menempati [startDate, endDate) — endDate bebas untuk booking berikutnya."
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: month, in: query, required: true, schema: { type: string, example: "2026-07" }, description: "YYYY-MM" }
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    properties:
                      vehicleId: { type: string }
                      month: { type: string, example: "2026-07" }
                      availableDates: { type: array, items: { type: string }, example: ["2026-07-01","2026-07-03"] }
                      bookedDates: { type: array, items: { type: string }, example: ["2026-07-05"] }
        "400": { description: Invalid month }

  # ============================================================
  # PUBLIC USER AUTH (X-API-Key + CookieAuth)
  # ============================================================
  /auth/phone/init:
    post:
      tags: [Auth]
      summary: Mulai login via WhatsApp — minta OTP (rate-limited 3/jam)
      security: [ { ApiKeyAuth: [] } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone]
              properties:
                phone: { type: string, example: "6281234567890", description: "8-15 digit" }
      responses:
        "200":
          description: Ref code + wa.me deep link
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    properties:
                      refCode: { type: string, example: "A3F9" }
                      waMeUrl: { type: string }
                      expiresAt: { type: string, format: date-time }

  /auth/phone/verify:
    post:
      tags: [Auth]
      summary: Verifikasi OTP & login (set httpOnly cookie)
      security: [ { ApiKeyAuth: [] } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, code]
              properties:
                phone: { type: string }
                code: { type: string, example: "123456", description: "6 digit" }
      responses:
        "200": { description: Logged in (sets cookie 'token'); find-or-create account by phone }
        "400": { description: Invalid/expired OTP }

  /auth/me:
    get:
      tags: [Auth]
      summary: Akun saat ini
      security: [ { ApiKeyAuth: [] }, { CookieAuth: [] } ]
      responses:
        "200": { description: Success }
        "401": { description: Not authenticated }

  /auth/profile:
    put:
      tags: [Auth]
      summary: Update profil (nama/avatar)
      security: [ { ApiKeyAuth: [] }, { CookieAuth: [] } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                avatarUrl: { type: string, nullable: true }
      responses:
        "200": { description: Success }

  /auth/logout:
    post:
      tags: [Auth]
      summary: Logout (revoke token + clear cookie)
      security: [ { ApiKeyAuth: [] }, { CookieAuth: [] } ]
      responses:
        "200": { description: Logged out }

