              type: number
              example: 100000
            description:
              type: string
              example: "Deposit required at pickup"

    # ---- Payment Methods ----
    PaymentMethods:
      type: object
      properties:
        gateway:
          type: string
          example: "xendit"
        methods:
          type: object
          properties:
            qris:
              type: object
              properties:
                id:
                  type: string
                  example: "QRIS"
                name:
                  type: string
                  example: "QRIS"
                description:
                  type: string
                  example: "Scan QR code to pay with any e-wallet or bank app"
                icon:
                  type: string
                  example: "qris"
            bankTransfer:
              type: object
              properties:
                id:
                  type: string
                  example: "BankTransfer"
                name:
                  type: string
                  example: "Virtual Account"
                description:
                  type: string
                  example: "Pay via bank transfer to virtual account number"
                icon:
                  type: string
                  example: "bank"
                banks:
                  type: array
                  items:
                    type: object
                    properties:
                      code:
                        type: string
                        example: "BCA"
                      name:
                        type: string
                        example: "Bank Central Asia"
                      icon:
                        type: string
                        example: "bca"
            gateway:
              type: object
              properties:
                id:
                  type: string
                  example: "Gateway"
                name:
                  type: string
                  example: "All Methods"
                description:
                  type: string
                  example: "Choose from all available payment methods"
                icon:
                  type: string
                  example: "gateway"

    # ---- Booking Status ----
    BookingStatus:
      type: object
      properties:
        bookingNumber:
          type: string
          example: "SVN-2026-0001"
        status:
          type: string
          enum: [pending_payment, Confirmed, Active, Completed, Cancelled, payment_failed, expired, refunded]
          example: "Confirmed"
        paymentStatus:
          type: string
          nullable: true
          enum: [pending, dp_paid, settlement, expire, deny, cancel, refund]
          example: "settlement"
        vehicleName:
          type: string
          example: "Honda CRF 250L"
        startDate:
          type: string
          example: "2026-07-01T02:00:00+07:00"
          description: ISO 8601 datetime — jam pickup aktual
        endDate:
          type: string
          example: "2026-07-03T02:00:00+07:00"
          description: ISO 8601 datetime — deadline return
        blocks:
          type: integer
          example: 2
          description: Jumlah block 12-jam
        totalAmount:
          type: number
          example: 750000
        paidAt:
          type: string
          nullable: true
          format: date-time
          example: "2026-06-25T14:30:00.000Z"

    # ---- Booking Create Response ----
    BookingCreateResponse:
      type: object
      properties:
        bookingId:
          type: string
          example: "bkg_abc123"
        bookingNumber:
          type: string
          example: "SVN-2026-0001"
        startDate:
          type: string
          example: "2026-07-01T02:00:00+07:00"
          description: ISO 8601 datetime — jam pickup yang dipilih client
        endDate:
          type: string
          example: "2026-07-01T14:00:00+07:00"
          description: ISO 8601 datetime — deadline return (startDate + N×12 jam)
        blocks:
          type: integer
          example: 1
          description: Jumlah block 12-jam
        vehicleName:
          type: string
          example: "Honda CRF 150L"
          description: Nama kendaraan yang dibooking
        paymentPageUrl:
          type: string
          nullable: true
          example: "https://checkout.xendit.co/web/xxxxx"
        qrString:
          type: string
          nullable: true
          example: "00020101021226..."
        totalAmount:
          type: number
          example: 750000
        paymentType:
          type: string
          enum: [full, dp]
          example: "full"
          description: "Down-payment (dp) uses one Xendit invoice with allow_partial."
        dpAmount:
          type: number
          nullable: true
          example: 225000
          description: "DP amount (only for paymentType=dp)."
        remainingAmount:
          type: number
          nullable: true
          example: 525000
        xenditInvoiceId:
          type: string
          nullable: true
          example: "inv_abc123"
        paymentError:
          type: string
          nullable: true
          example: null

    # ---- Lead ----
    LeadSubmitResponse:
      type: object
      properties:
        id:
          type: string
          example: "lead_abc123"
        status:
          type: string
          example: "New"
        createdAt:
          type: string
          format: date-time
          example: "2026-06-20T10:30:00.000Z"

# ============================================================
# PATHS
# ============================================================
paths:

  # ============================================================
  # 1. VEHICLES - List & Detail
  # ============================================================
  /vehicles:
    get:
      tags: [Vehicles]
      summary: List semua kendaraan
      description: |
        Mendapatkan daftar semua kendaraan yang tersedia.
        Digunakan untuk menampilkan katalog kendaraan di landing page.
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/VehicleListItem"
              example:
                success: true
                data:
                  - id: "v_001"
                    name: "Honda CRF 250L"
                    type: "TrailBike"
                    category: "Adventure"
                    image: "https://api.savannabromo.com/api/v1/uploads/vehicles/crf250.jpg"
                    dailyRateIdr: 250000
                    specs:
                      engine: "250cc"
                      fuel: "13L"
                    description: "Perfect for Bromo trail riding"
                    available: true
                  - id: "v_002"
                    name: "Kawasaki KLX 230"
                    type: "TrailBike"
                    category: "Adventure"
                    image: "https://api.savannabromo.com/api/v1/uploads/vehicles/klx230.jpg"
                    dailyRateIdr: 200000
                    specs:
                      engine: "233cc"
                      fuel: "7.5L"
                    description: "Lightweight and agile"
                    available: true

  /vehicles/{id}:
    get:
      tags: [Vehicles]
      summary: Detail kendaraan
      description: Mendapatkan detail lengkap satu kendaraan berdasarkan ID.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Vehicle ID
          example: "v_001"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: "#/components/schemas/VehicleDetail"
        "404":
          description: Vehicle not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                error:
                  code: "NOT_FOUND"
                  message: "Vehicle not found"

  # ============================================================
  # 2. VEHICLE TYPES
  # ============================================================
  /vehicle-types:
    get:
      tags: [Vehicles]
      summary: List tipe kendaraan
      description: |
        Mendapatkan daftar tipe kendaraan dengan statistik (jumlah unit, range harga).
        Digunakan untuk filter/kategori di landing page.
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      types:
                        type: array
                        items:
                          $ref: "#/components/schemas/VehicleType"
              example:
                success: true
                data:
                  types:
                    - type: "TrailBike"
                      displayName: "Trail Bike"
                      count: 4
                      minDailyRate: 150000
                      maxDailyRate: 350000
                    - type: "Jeep"
                      displayName: "Jeep"
                      count: 2
                      minDailyRate: 500000
                      maxDailyRate: 800000

  # ============================================================
  # 3. AVAILABILITY CHECK
  # ============================================================
  /availability:
    get:
      tags: [Availability]
      summary: Cek ketersediaan kendaraan
      description: |
        Mengecek kendaraan yang tersedia pada tanggal tertentu.
        WAJIB gunakan endpoint ini SEBELUM membuat booking.

        **Unavailable reasons:**
        - `Already booked` - Sudah dibooking orang lain
        - `Under maintenance` - Sedang dalam perbaikan
        - `Currently unavailable` - Status tidak tersedia
      parameters:
        - name: startDate
          in: query
          required: true
          schema:
            type: string
            pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$"
          description: Tanggal mulai (YYYY-MM-DD)
          example: "2026-07-01"
        - name: endDate
          in: query
          required: true
          schema:
            type: string
            pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$"
          description: Tanggal selesai (YYYY-MM-DD)
          example: "2026-07-03"
        - name: type
          in: query
          required: false
          schema:
            type: string
            enum: [TrailBike, StreetBike, Car, Jeep, Other]
          description: Filter berdasarkan tipe kendaraan (opsional)
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      requestedPeriod:
                        type: object
                        properties:
                          startDate:
                            type: string
                            example: "2026-07-01"
                          endDate:
                            type: string
                            example: "2026-07-03"
                      availableVehicles:
                        type: array
                        items:
                          $ref: "#/components/schemas/AvailableVehicle"
                      unavailableVehicles:
                        type: array
                        items:
                          $ref: "#/components/schemas/UnavailableVehicle"
                      totalAvailable:
                        type: integer
                        example: 3
              example:
                success: true
                data:
                  requestedPeriod:
                    startDate: "2026-07-01"
                    endDate: "2026-07-03"
                  availableVehicles:
                    - id: "v_001"
                      name: "Honda CRF 250L"
                      type: "TrailBike"
                      dailyRateIdr: 250000
                      photoUrl: "https://api.savannabromo.com/api/v1/uploads/vehicles/crf250.jpg"
                  unavailableVehicles:
                    - id: "v_002"
                      name: "Kawasaki KLX 230"
                      reason: "Already booked"
                  totalAvailable: 1
        "400":
          description: Validation error (startDate > endDate)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ============================================================
  # 4. BOOKINGS
  # ============================================================
  /bookings:
    post:
      tags: [Bookings]
      summary: Buat booking baru
      description: |
        Membuat booking baru dan trigger payment ke Xendit.

        **Sistem sewa 12 jam:**
        - Sewa dihitung per block 12 jam, bukan per hari
        - Contoh: startDate `02:00` → endDate `14:00` = 1 block (12 jam)
        - Contoh: startDate `02:00` → endDate `02:00 besok` = 1 block (12 jam)
        - Denda keterlambatan: per jam = (rate/12) × 1.5

        **Flow:**
        1. Cek ketersediaan via `GET /availability`
        2. Kirim request booking ini (bisa kirim datetime lengkap dengan jam)
        3. Response berisi `startDate`, `endDate` (datetime lengkap), `paymentPageUrl`, `qrString`
        4. Redirect user ke `paymentPageUrl` ATAU render QR dari `qrString`
        5. User bayar
        6. Backend otomatis update status via webhook Xendit

        **Validasi otomatis:**
        - endDate harus > startDate
        - Vehicle harus ada dan status Available
        - Tidak ada conflict booking pada rentang waktu yang sama
        - Customer otomatis dibuat/ambil berdasarkan phone number
        - Double-booking return 409 Conflict

        **Harga:**
        - `totalAmount = jumlah_12jam_block × dailyRateIdr + equipment`
        - Pembayaran full di depan (Full_Upfront) atau DP (Down Payment)

        **Payment method:**
        - `Gateway` (default) - Semua metode pembayaran
        - `QRIS` - QR code saja
        - `BankTransfer` - Virtual Account (BCA, BNI, BRI, Mandiri)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - vehicleId
                - startDate
                - endDate
                - customerName
                - customerPhone
              properties:
                vehicleId:
                  type: string
                  description: ID kendaraan dari endpoint GET /vehicles
                  example: "v_001"
                  minLength: 1
                startDate:
                  type: string
                  pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}(T[0-9]{2}:[0-9]{2}:[0-9]{2}([+-][0-9]{2}:[0-9]{2}|Z)?)?$"
                  description: Tanggal/jam mulai rental (YYYY-MM-DD atau ISO 8601 datetime)
                  example: "2026-07-01T02:00:00+07:00"
                endDate:
                  type: string
                  pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}(T[0-9]{2}:[0-9]{2}:[0-9]{2}([+-][0-9]{2}:[0-9]{2}|Z)?)?$"
                  description: Tanggal/jam selesai rental (YYYY-MM-DD atau ISO 8601 datetime)
                  example: "2026-07-03T14:00:00+07:00"
                customerName:
                  type: string
                  description: Nama lengkap customer
                  example: "Budi Santoso"
                  minLength: 2
                customerPhone:
                  type: string
                  description: Nomor telepon customer (min 8 digit)
                  example: "+628123456789"
                  minLength: 8
                customerEmail:
                  type: string
                  format: email
                  description: Email customer (opsional, untuk kirim konfirmasi)
                  example: "budi@email.com"
                  nullable: true
                paymentMethod:
                  type: string
                  enum: [QRIS, BankTransfer, Gateway]
                  description: "Metode pembayaran (default: Gateway)"
                  default: "Gateway"
                  example: "Gateway"
                notes:
                  type: string
                  description: Catatan tambahan (opsional)
                  example: "Pickup di hotel"
                  maxLength: 1000
                  nullable: true
                paymentType:
                  type: string
                  enum: [full, dp]
                  description: "Tipe pembayaran: full (lunas) atau dp (down payment, default 30%)"
                  default: "full"
                  example: "full"
                equipment:
                  type: array
                  description: Peralatan tambahan yang disewa (opsional)
                  items:
                    type: object
                    required: [equipmentId, quantity]
                    properties:
                      equipmentId:
                        type: string
                        example: "eq_helm_honda"
                        description: ID equipment dari GET /equipment
                      quantity:
                        type: integer
                        minimum: 1
                        example: 1
            examples:
              minimal:
                summary: Minimal request (date-only)
                value:
                  vehicleId: "v_001"
                  startDate: "2026-07-01"
                  endDate: "2026-07-03"
                  customerName: "Budi Santoso"
                  customerPhone: "+628123456789"
              with_time:
                summary: Request dengan jam (datetime)
                value:
                  vehicleId: "v_001"
                  startDate: "2026-07-01T02:00:00+07:00"
                  endDate: "2026-07-01T14:00:00+07:00"
                  customerName: "Budi Santoso"
                  customerPhone: "+628123456789"
                  customerEmail: "budi@email.com"
                  paymentMethod: "QRIS"
                  notes: "Pickup di Hotel Bromo Indah jam 8 pagi"
                  paymentType: "dp"
                  equipment:
                    - equipmentId: "eq_helm_honda"
                      quantity: 1
                    - equipmentId: "eq_phone_mount"
                      quantity: 1
      responses:
        "201":
          description: Booking created, payment initiated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Booking created successfully"
                  data:
                    $ref: "#/components/schemas/BookingCreateResponse"
              examples:
                qris_payment:
                  summary: QRIS payment (render QR code)
                  value:
                    success: true
                    message: "Booking created successfully"
                    data:
                      bookingId: "bkg_abc123"
                      bookingNumber: "SVN-2026-0001"
                      startDate: "2026-07-01T02:00:00+07:00"
                      endDate: "2026-07-01T14:00:00+07:00"
                      blocks: 1
                      vehicleName: "Honda CRF 150L"
                      paymentPageUrl: "https://checkout.xendit.co/web/xxxxx"
                      qrString: "00020101021226580014COM.GO-JEK.WWW0118936009143654328902035000303UME51440014CO.QRIS.WWW0215ID102541999900303UME5204599953033605407100000.005802ID5914SAVANNA BROMO6008TRENGGALEK6105661236250..."
                      totalAmount: 750000
                      dpAmount: 0
                      remainingAmount: 0
                      paymentType: "full"
                      paymentError: null
                gateway_payment:
                  summary: Gateway payment (redirect to Xendit)
                  value:
                    success: true
                    message: "Booking created successfully"
                    data:
                      bookingId: "bkg_def456"
                      bookingNumber: "SVN-2026-0002"
                      startDate: "2026-07-02T06:00:00+07:00"
                      endDate: "2026-07-02T18:00:00+07:00"
                      blocks: 1
                      vehicleName: "Kawasaki KLX 230"
                      paymentPageUrl: "https://checkout.xendit.co/web/xxxxx"
                      qrString: null
                      totalAmount: 500000
                      dpAmount: 0
                      remainingAmount: 0
                      paymentType: "full"
                      paymentError: null
                payment_error:
                  summary: Payment gateway error (booking tetap dibuat)
                  value:
                    success: true
                    message: "Booking created successfully"
                    data:
                      bookingId: "bkg_ghi789"
                      bookingNumber: "SVN-2026-0003"
                      startDate: "2026-07-03T08:00:00+07:00"
                      endDate: "2026-07-03T20:00:00+07:00"
                      blocks: 1
                      vehicleName: "Honda CRF 250L"
                      paymentPageUrl: null
                      qrString: null
                      totalAmount: 500000
                      dpAmount: 0
                      remainingAmount: 0
                      paymentType: "full"
                      paymentError: "Failed to create payment invoice"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                invalid_dates:
                  summary: Invalid dates
                  value:
                    success: false
                    error:
                      code: "VALIDATION_ERROR"
                      message: "End date must be after start date"
                vehicle_unavailable:
                  summary: Vehicle not available
                  value:
                    success: false
                    error:
                      code: "VALIDATION_ERROR"
                      message: "Vehicle is not available"
                date_conflict:
                  summary: Date conflict
                  value:
                    success: false
                    error:
                      code: "VALIDATION_ERROR"
                      message: "Vehicle is already booked for the selected dates"
                vehicle_not_found:
                  summary: Vehicle not found
                  value:
                    success: false
                    error:
                      code: "VALIDATION_ERROR"
                      message: "Vehicle not found"
                blacklisted:
                  summary: Customer blacklisted
                  value:
                    success: false
                    error:
                      code: "VALIDATION_ERROR"
                      message: "Customer is blacklisted"

  # ============================================================
  # 5. BOOKING STATUS CHECK
  # ============================================================
  /bookings/{bookingNumber}/status:
    get:
      tags: [Bookings]
      summary: Cek status booking
      description: |
        Mengecek status booking berdasarkan booking number.
        Digunakan untuk halaman "Cek Pesanan" di landing page.
        Customer bisa cek status tanpa login, cukup dengan booking number.
      parameters:
        - name: bookingNumber
          in: path
          required: true
          schema:
            type: string
          description: "Booking number (format: SVN-YYYY-NNNN)"
          example: "SVN-2026-0001"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: "#/components/schemas/BookingStatus"
              examples:
                confirmed:
                  summary: Booking confirmed (sudah bayar)
                  value:
                    success: true
                    data:
                      bookingNumber: "SVN-2026-0001"
                      status: "Confirmed"
                      paymentStatus: "settlement"
                      vehicleName: "Honda CRF 250L"
                      startDate: "2026-07-01T02:00:00+07:00"
                      endDate: "2026-07-02T02:00:00+07:00"
                      blocks: 2
                      totalAmount: 750000
                      paidAt: "2026-06-25T14:30:00.000Z"
                pending:
                  summary: Belum bayar
                  value:
                    success: true
                    data:
                      bookingNumber: "SVN-2026-0002"
                      status: "pending_payment"
                      paymentStatus: "pending"
                      vehicleName: "Kawasaki KLX 230"
                      startDate: "2026-07-05T06:00:00+07:00"
                      endDate: "2026-07-05T18:00:00+07:00"
                      blocks: 1
                      totalAmount: 200000
                      paidAt: null
        "404":
          description: Booking not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                error:
                  code: "NOT_FOUND"
                  message: "Booking not found"

