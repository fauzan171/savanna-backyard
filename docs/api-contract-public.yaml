  # ============================================================
  # 9. REVIEWS
  # ============================================================
  /reviews:
    get:
      tags: [Reviews]
      summary: List reviews/testimonial
      description: |
        Mendapatkan daftar review dari customer.
        Digunakan untuk section "Testimonial" di landing page.

        **Filter:**
        - `limit` - Jumlah review per halaman (default: 10, max: 100)
        - `offset` - Offset untuk pagination (default: 0)
        - `rating` - Filter berdasarkan rating (1-5)
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
          description: Jumlah review per halaman
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
          description: Offset untuk pagination
        - name: rating
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 5
          description: Filter berdasarkan rating
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Review"
                  meta:
                    type: object
                    properties:
                      total:
                        type: integer
                        example: 25
                      averageRating:
                        type: number
                        example: 4.8
              example:
                success: true
                data:
                  - id: "rev_001"
                    name: "John Doe"
                    location: "Jakarta, Indonesia"
                    rating: 5
                    text: "Amazing experience! The trail was incredible."
                    avatar: "JD"
                    createdAt: "2026-05-15T10:30:00.000Z"
                  - id: "rev_002"
                    name: "Sarah Smith"
                    location: "Bali"
                    rating: 5
                    text: "Best adventure ever! Will come back again."
                    avatar: "SS"
                    createdAt: "2026-05-10T08:00:00.000Z"
                meta:
                  total: 25
                  averageRating: 4.8

